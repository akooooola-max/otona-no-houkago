<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大人の放課後 — 出欠アプリ</title>
<style>
  :root {
    --brand: #2b6bff; --brand-deep: #1746c9; --brand-soft: #e2e9ff;
    --ink: #14192a; --muted: #5c6473; --line: #e4e7f0;
    --paper: #f4f6fb; --card: #ffffff;
    --amber: #c98a12; --amber-soft: #fbf0d8;
    --clay: #d6493f; --clay-soft: #fbe4e2;
    --go: #1a9e57; --go-soft: #e0f2e8;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(20,25,42,.05), 0 6px 20px rgba(20,25,42,.06);
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #5b8cff; --brand-deep: #4d84ff; --brand-soft: #16203f;
      --ink: #eaeef7; --muted: #97a0b5; --line: #232a3d;
      --paper: #0a0d15; --card: #131824;
      --amber: #e6b45a; --amber-soft: #2c2412;
      --clay: #e0736a; --clay-soft: #2e1613;
      --go: #34c878; --go-soft: #10281c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 96px; }

  header { padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; border-radius: 11px; background: var(--brand); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; }
  .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .brand p { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .me { font-size: 13px; color: var(--muted); background: var(--card); border: 1px solid var(--line); padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .me b { color: var(--ink); font-weight: 700; }

  .section-label { padding: 6px 22px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .events { display: flex; flex-direction: column; gap: 14px; padding: 4px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .ev { cursor: pointer; transition: transform .12s ease; }
  .ev:active { transform: scale(.99); }
  .ev-top { padding: 16px 18px 12px; }
  .ev-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ev-title { font-size: 17px; font-weight: 800; letter-spacing: -.3px; }
  .ev-meta { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .pill { font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--brand-soft); color: var(--brand-deep); }
  .pill.full { background: var(--clay-soft); color: var(--clay); }
  .ev-bar { height: 6px; background: var(--line); }
  .ev-bar i { display: block; height: 100%; background: var(--brand); transition: width .3s ease; }
  .ev-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; }
  .avatars { display: flex; }
  .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--brand-deep); border: 2px solid var(--card); margin-left: -8px; }
  .av:first-child { margin-left: 0; }
  .av.more { background: var(--muted); }
  .count { font-size: 13px; color: var(--muted); }
  .count b { color: var(--ink); font-weight: 800; font-size: 15px; }
  .myrsvp { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .myrsvp.going { background: var(--go-soft); color: var(--go); }
  .myrsvp.maybe { background: var(--amber-soft); color: var(--amber); }
  .myrsvp.out { background: var(--clay-soft); color: var(--clay); }

  .empty { text-align: center; color: var(--muted); padding: 60px 30px; }
  .empty svg { width: 46px; height: 46px; opacity: .5; margin-bottom: 12px; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 30; background: var(--brand); color: #fff; border: none; border-radius: 999px; padding: 15px 26px; font-size: 15px; font-weight: 800; box-shadow: 0 8px 24px rgba(43,107,255,.4); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .fab:active { transform: translateX(-50%) scale(.97); }

  .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10,13,21,.55); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 480px; background: var(--paper); border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto; transform: translateY(30px); transition: transform .24s cubic-bezier(.2,.7,.3,1); }
  .overlay.on .sheet { transform: translateY(0); }
  .sheet-head { position: sticky; top: 0; background: var(--paper); padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { font-size: 17px; font-weight: 800; }
  .x { border: none; background: var(--card); border: 1px solid var(--line); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; color: var(--muted); cursor: pointer; line-height: 1; }
  .sheet-body { padding: 18px 20px 30px; }

  label.fld { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 6px; }
  input, textarea { width: 100%; font-family: var(--sans); font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .two { display: flex; gap: 12px; }
  .two > div { flex: 1; }
  .save { margin-top: 24px; width: 100%; background: var(--brand); color: #fff; border: none; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; }
  .save:active { transform: scale(.99); }

  .d-hero { padding: 20px; }
  .d-title { font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
  .d-meta { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; color: var(--muted); }
  .d-meta b { color: var(--ink); font-weight: 700; }
  .capbar { margin: 16px 0 4px; }
  .capbar .track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .capbar .track i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .3s ease; }
  .capbar .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

  .rsvp-choice { display: flex; gap: 10px; padding: 4px 20px 8px; }
  .rsvp-choice button { flex: 1; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 6px; font-size: 14px; font-weight: 800; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .12s ease; }
  .rsvp-choice button .ic { font-size: 19px; }
  .rsvp-choice button.sel.going { border-color: var(--go); background: var(--go-soft); color: var(--go); }
  .rsvp-choice button.sel.maybe { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
  .rsvp-choice button.sel.out { border-color: var(--clay); background: var(--clay-soft); color: var(--clay); }

  .roster { padding: 8px 20px 20px; }
  .roster h3 { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
  .roster h3 .n { background: var(--line); color: var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .person { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: none; }
  .person .av { margin: 0; width: 32px; height: 32px; font-size: 12px; border: none; }
  .person .nm { font-size: 15px; font-weight: 600; }
  .person .pos { font-size: 12px; color: var(--muted); }
  .person.me-tag .nm::after { content: "あなた"; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--brand-deep); background: var(--brand-soft); padding: 1px 7px; border-radius: 999px; }
  .none { font-size: 13px; color: var(--muted); padding: 6px 0; }
  .edit-link { display: inline-flex; align-items: center; gap: 6px; margin: 4px 20px 24px; font-size: 13px; font-weight: 700; color: var(--brand-deep); background: none; border: none; cursor: pointer; }

  .note { margin: 4px 16px 0; padding: 11px 14px; background: var(--brand-soft); color: var(--brand-deep); border-radius: 12px; font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">放</div>
      <div>
        <h1>大人の放課後</h1>
        <p>活動の出欠・仲間</p>
      </div>
    </div>
    <button class="me" id="meBtn"></button>
  </header>

  <div class="note">試作版です。データはこのスマホの中だけに保存されます（他の人とは共有されません）。使い心地の確認用。</div>

  <div class="section-label">今後の活動</div>
  <div class="events" id="events"></div>
</div>

<button class="fab" id="addBtn"><span style="font-size:18px;line-height:1;">＋</span> 活動を追加</button>

<div class="overlay" id="nameOv">
  <div class="sheet">
    <div class="sheet-head"><h2>あなたのプロフィール</h2><button class="x" data-close>×</button></div>
    <div class="sheet-body">
      <label class="fld">ニックネーム</label>
      <input id="nmName" placeholder="たろう" maxlength="12" />
      <label class="fld">ポジション・ひとこと</label>
      <input id="nmPos" placeholder="前 / CB / どこでも" maxlength="10" />
      <button class="save" id="nmSave">保存する</button>
    </div>
  </div>
</div>

<div class="overlay" id="formOv">
  <div class="sheet">
    <div class="sheet-head"><h2 id="formTitle">活動を追加</h2><button class="x" data-close>×</button></div>
    <div class="sheet-body">
      <label class="fld">タイトル</label>
      <input id="fTitle" placeholder="日曜あさフットサル" maxlength="24" />
      <div class="two">
        <div>
          <label class="fld">日付</label>
          <input id="fDate" type="date" />
        </div>
        <div>
          <label class="fld">開始</label>
          <input id="fTime" type="time" />
        </div>
      </div>
      <label class="fld">場所</label>
      <input id="fPlace" placeholder="自社グラウンド" maxlength="30" />
      <label class="fld">定員（人）</label>
      <input id="fCap" type="number" min="2" max="40" placeholder="12" />
      <label class="fld">ひとこと（任意）</label>
      <textarea id="fNote" rows="2" placeholder="初心者歓迎！ビブス貸します" maxlength="80"></textarea>
      <button class="save" id="fSave">この内容で追加する</button>
    </div>
  </div>
</div>

<div class="overlay" id="detailOv">
  <div class="sheet">
    <div class="sheet-head"><h2>活動の詳細</h2><button class="x" data-close>×</button></div>
    <div id="detailBody"></div>
  </div>
</div>

<script>
(function(){
  var LS = { me: "otonabu_me", events: "otonabu_events" };
  var el = function(id){ return document.getElementById(id); };
  var COLORS = ["#1746c9","#1f7a9d","#9d5a1f","#7a1f9d","#9d1f4a","#1f9d7a"];

  function loadMe(){ try { return JSON.parse(localStorage.getItem(LS.me)) || null; } catch(e){ return null; } }
  function saveMe(m){ localStorage.setItem(LS.me, JSON.stringify(m)); }
  function loadEvents(){ try { return JSON.parse(localStorage.getItem(LS.events)) || null; } catch(e){ return null; } }
  function saveEvents(e){ localStorage.setItem(LS.events, JSON.stringify(e)); }

  var me = loadMe();
  var events = loadEvents();

  if(!events){
    var d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7));
    var iso = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    events = [{
      id: "seed1", title: "日曜あさフットサル", date: iso, time: "09:00",
      place: "自社グラウンド", cap: 12, note: "初心者歓迎！ビブス貸します",
      rsvp: { "けんた": {s:"going",pos:"前"}, "りょう": {s:"going",pos:"CB"}, "みさき": {s:"going",pos:"初心者"}, "しょう": {s:"maybe",pos:"どこでも"} }
    }];
    saveEvents(events);
  }

  function initials(name){ return (name||"?").slice(0,2); }
  function colorFor(name){ var h=0; for(var i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); return COLORS[Math.abs(h)%COLORS.length]; }
  function fmtDate(iso, time){
    if(!iso) return "";
    var p = iso.split("-"); var dt = new Date(p[0], p[1]-1, p[2]);
    var wd = ["日","月","火","水","木","金","土"][dt.getDay()];
    return (dt.getMonth()+1)+"/"+dt.getDate()+"（"+wd+"）"+(time? " "+time : "");
  }
  function goingCount(ev){ var n=0; for(var k in ev.rsvp){ if(ev.rsvp[k].s==="going") n++; } return n; }
  function statusList(ev, s){ var a=[]; for(var k in ev.rsvp){ if(ev.rsvp[k].s===s) a.push({name:k, pos:ev.rsvp[k].pos}); } return a; }
  function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function renderMe(){
    el("meBtn").innerHTML = me ? ("<b>"+esc(me.name)+"</b> · "+esc(me.pos||"—")) : "プロフィール登録";
  }

  function renderEvents(){
    var host = el("events");
    events.sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
    if(!events.length){
      host.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><div>まだ活動がありません。<br>「＋ 活動を追加」から立ててみましょう。</div></div>';
      return;
    }
    host.innerHTML = "";
    events.forEach(function(ev){
      var g = goingCount(ev);
      var full = g >= ev.cap;
      var pct = Math.min(100, Math.round(g/ev.cap*100));
      var goers = statusList(ev,"going");
      var mine = me && ev.rsvp[me.name] ? ev.rsvp[me.name].s : null;
      var myLabel = {going:"参加",maybe:"未定",out:"不参加"}[mine];
      var avs = goers.slice(0,3).map(function(p){ return '<div class="av" style="background:'+colorFor(p.name)+'">'+esc(initials(p.name))+'</div>'; }).join("");
      if(goers.length>3) avs += '<div class="av more">+'+(goers.length-3)+'</div>';
      if(!goers.length) avs = '<span class="count">まだ参加者なし</span>';

      var c = document.createElement("div");
      c.className = "card ev";
      c.innerHTML =
        '<div class="ev-top"><div class="ev-row">'+
          '<div><div class="ev-title">'+esc(ev.title)+'</div>'+
          '<div class="ev-meta"><span>📅 '+fmtDate(ev.date,ev.time)+'</span><span>📍 '+esc(ev.place)+'</span></div></div>'+
          '<span class="pill '+(full?"full":"ok")+'">'+(full?"満員":"残"+(ev.cap-g))+'</span>'+
        '</div></div>'+
        '<div class="ev-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="ev-foot"><div class="avatars">'+avs+'</div>'+
          '<div style="display:flex;align-items:center;gap:10px;">'+
          (myLabel? '<span class="myrsvp '+mine+'">'+myLabel+'</span>':'')+
          '<span class="count"><b>'+g+'</b>/'+ev.cap+'</span></div>'+
        '</div>';
      c.addEventListener("click", function(){ openDetail(ev.id); });
      host.appendChild(c);
    });
  }

  function open(ov){ el(ov).classList.add("on"); }
  function close(ov){ el(ov).classList.remove("on"); }
  document.querySelectorAll("[data-close]").forEach(function(b){
    b.addEventListener("click", function(){ b.closest(".overlay").classList.remove("on"); });
  });
  document.querySelectorAll(".overlay").forEach(function(o){
    o.addEventListener("click", function(e){ if(e.target===o) o.classList.remove("on"); });
  });

  el("meBtn").addEventListener("click", function(){
    if(me){ el("nmName").value=me.name; el("nmPos").value=me.pos||""; }
    open("nameOv");
  });
  el("nmSave").addEventListener("click", function(){
    var n = el("nmName").value.trim();
    if(!n){ el("nmName").focus(); return; }
    var old = me ? me.name : null;
    me = { name:n, pos: el("nmPos").value.trim() };
    saveMe(me);
    if(old && old!==n){
      events.forEach(function(ev){ if(ev.rsvp[old]){ ev.rsvp[n]=ev.rsvp[old]; delete ev.rsvp[old]; } });
      saveEvents(events);
    }
    renderMe(); renderEvents(); close("nameOv");
  });

  var editingId = null;
  el("addBtn").addEventListener("click", function(){
    editingId = null;
    el("formTitle").textContent = "活動を追加";
    el("fTitle").value=""; el("fDate").value=""; el("fTime").value="09:00";
    el("fPlace").value=""; el("fCap").value="12"; el("fNote").value="";
    open("formOv");
  });
  el("fSave").addEventListener("click", function(){
    var t = el("fTitle").value.trim(); var dt = el("fDate").value;
    if(!t){ el("fTitle").focus(); return; }
    if(!dt){ el("fDate").focus(); return; }
    var data = {
      title: t, date: dt, time: el("fTime").value || "",
      place: el("fPlace").value.trim() || "未定",
      cap: Math.max(2, parseInt(el("fCap").value)||12),
      note: el("fNote").value.trim()
    };
    if(editingId){
      var ev = events.find(function(e){return e.id===editingId;});
      Object.assign(ev, data);
    } else {
      data.id = "ev"+Date.now(); data.rsvp = {};
      events.push(data);
    }
    saveEvents(events); renderEvents(); close("formOv");
    if(!editingId) setTimeout(function(){ openDetail(events[events.length-1].id); }, 180);
  });

  function openDetail(id){
    var ev = events.find(function(e){return e.id===id;});
    if(!ev) return;
    var g = goingCount(ev); var pct = Math.min(100, Math.round(g/ev.cap*100));
    var full = g>=ev.cap;
    var mine = me && ev.rsvp[me.name] ? ev.rsvp[me.name].s : null;

    function group(s, label){
      var list = statusList(ev,s);
      var rows = list.length ? list.map(function(p){
        var isMe = me && p.name===me.name;
        return '<div class="person'+(isMe?' me-tag':'')+'"><div class="av" style="background:'+colorFor(p.name)+'">'+esc(initials(p.name))+'</div>'+
          '<div><div class="nm">'+esc(p.name)+'</div>'+(p.pos?'<div class="pos">'+esc(p.pos)+'</div>':'')+'</div></div>';
      }).join("") : '<div class="none">まだいません</div>';
      return '<h3>'+label+' <span class="n">'+list.length+'</span></h3>'+rows;
    }

    var choices = [["going","参加","⚽"],["maybe","未定","🤔"],["out","不参加","✕"]].map(function(c){
      return '<button class="'+c[0]+(mine===c[0]?' sel '+c[0]:'')+'" data-s="'+c[0]+'"><span class="ic">'+c[2]+'</span>'+c[1]+'</button>';
    }).join("");

    el("detailBody").innerHTML =
      '<div class="d-hero"><div class="d-title">'+esc(ev.title)+'</div>'+
        '<div class="d-meta">'+
          '<span>📅 <b>'+fmtDate(ev.date,ev.time)+'</b></span>'+
          '<span>📍 <b>'+esc(ev.place)+'</b></span>'+
          (ev.note?'<span>💬 '+esc(ev.note)+'</span>':'')+
        '</div>'+
        '<div class="capbar"><div class="track"><i style="width:'+pct+'%"></i></div>'+
          '<div class="lbl"><span>参加 '+g+' 人</span><span>'+(full?'満員':'定員まであと '+(ev.cap-g)+' 人')+'</span></div></div>'+
      '</div>'+
      (me ? '<div class="rsvp-choice">'+choices+'</div>' :
        '<div class="note" style="margin:4px 20px 12px;">先に右上でプロフィールを登録すると出欠を入れられます。</div>')+
      '<div class="roster">'+group("going","参加")+group("maybe","未定")+group("out","不参加")+'</div>'+
      '<button class="edit-link" id="editEv">✎ この活動を編集</button>';

    el("detailBody").querySelectorAll(".rsvp-choice button").forEach(function(b){
      b.addEventListener("click", function(){
        var s = b.getAttribute("data-s");
        if(mine===s){ delete ev.rsvp[me.name]; }
        else { ev.rsvp[me.name] = { s:s, pos: me.pos||"" }; }
        saveEvents(events); renderEvents(); openDetail(id);
      });
    });
    var ee = el("editEv");
    if(ee) ee.addEventListener("click", function(){
      editingId = id;
      el("formTitle").textContent = "活動を編集";
      el("fTitle").value=ev.title; el("fDate").value=ev.date; el("fTime").value=ev.time;
      el("fPlace").value=ev.place; el("fCap").value=ev.cap; el("fNote").value=ev.note||"";
